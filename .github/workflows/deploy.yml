name: Build and Deploy to Docs

on:
  push:
    branches: [ main ] # 触发分支，根据你的主分支名称调整（如 master）

permissions:
  contents: write # 授予 Action 推送代码到仓库的权限

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '22' # 根据项目需要调整 Node 版本
          cache: 'npm'

      - name: Install Dependencies 📦
        run: npm ci

      - name: Build Project 🔨
        run: npm run build

      - name: Rename Build to Docs 📁
        run: mv build docs

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs # 部署 docs 文件夹的内容
